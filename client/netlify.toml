[build]
  command = "npm run build"
  publish = "dist"

[context.production]
  environment = { VITE_API_BASE_URL = "https://your-backend-url.com/api" }

[context.development]
  environment = { VITE_API_BASE_URL = "http://localhost:5000/api" }

# Redirect all non-file requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
